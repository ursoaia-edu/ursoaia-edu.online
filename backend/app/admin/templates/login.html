<!DOCTYPE html>
<html lang="ro" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ursoaia Edu Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.0/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        :root {
            --primary-dark: #2b2d42;
            --primary-light: #8d99ae;
            --accent: #ef233c;
            --accent-secondary: #ff6b35;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary-dark) 0%, #1a1b2e 100%);
        }
        
        .login-card {
            background: rgba(43, 45, 66, 0.95);
            backdrop-filter: blur(10px);
        }
        
        .btn-gradient {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-secondary) 100%);
            border: none;
        }
        
        .btn-gradient:hover {
            background: linear-gradient(135deg, var(--accent-secondary) 0%, var(--accent) 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(239, 35, 60, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="login-card rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-[var(--accent)] to-[var(--accent-secondary)] flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white">Ursoaia Edu</h1>
            <p class="text-gray-400 mt-2">Admin Panel</p>
        </div>
        
        <form hx-post="/api/admin/auth/login" hx-redirect="/admin" class="space-y-4">
            <div class="form-control">
                <label class="label">
                    <span class="label-text text-gray-300">Email</span>
                </label>
                <input type="email" name="email" placeholder="admin@example.com" class="input input-bordered bg-base-300 text-white" required />
            </div>
            
            <div class="form-control">
                <label class="label">
                    <span class="label-text text-gray-300">Password</span>
                </label>
                <input type="password" name="password" placeholder="••••••••" class="input input-bordered bg-base-300 text-white" required />
            </div>
            
            <div id="error-message" class="hidden alert alert-error"></div>
            
            <button type="submit" class="btn btn-gradient w-full text-white font-semibold py-3 transition-all duration-300">
                Sign In
            </button>
        </form>
        
        <div class="mt-6 text-center text-gray-500 text-sm">
            <p>Ursoaia Educational Portal</p>
        </div>
    </div>
    
    <script>
        document.body.addEventListener('htmx:responseError', function(evt) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = evt.detail.xhr.response ? JSON.parse(evt.detail.xhr.response).detail : 'Login failed';
            errorDiv.classList.remove('hidden');
        });
    </script>
</body>
</html>
