{% extends "base.html" %} {% block title %}Edit Article{% endblock %} {% block
page_title %}Edit Article{% endblock %} {% block head %}
<link
    href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css"
    rel="stylesheet"
/>
<style>
    .ql-toolbar.ql-snow {
        background: oklch(var(--b2));
        border-color: oklch(var(--b3));
    }
    .ql-container.ql-snow {
        border-color: oklch(var(--b3));
    }
    .ql-editor {
        min-height: 400px;
        color: oklch(var(--bc));
        font-size: 1rem;
    }
    .ql-editor.ql-blank::before {
        color: oklch(var(--bc) / 0.4);
    }
    .ql-snow .ql-stroke {
        stroke: oklch(var(--bc));
    }
    .ql-snow .ql-fill {
        fill: oklch(var(--bc));
    }
    .ql-snow .ql-picker {
        color: oklch(var(--bc));
    }
    .ql-snow .ql-picker-options {
        background: oklch(var(--b1));
        border-color: oklch(var(--b3));
    }
</style>
{% endblock %} {% block content %}
<div class="max-w-4xl mx-auto">
    <div class="card bg-base-100 shadow-xl rounded-2xl">
        <div class="card-body">
            <form
                id="article-form"
                data-article-id="{{ article.id }}"
                class="space-y-6"
            >
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-semibold">Title</span>
                    </label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        value="{{ article.title }}"
                        placeholder="Enter article title"
                        class="input input-bordered text-lg"
                        required
                    />
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-semibold">Excerpt</span>
                    </label>
                    <textarea
                        id="excerpt"
                        name="excerpt"
                        placeholder="Brief description for SEO and previews"
                        class="textarea textarea-bordered"
                        rows="2"
                    >
{{ article.excerpt }}</textarea
                    >
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-semibold"
                                >Categories</span
                            >
                        </label>
                        <select
                            name="category_ids"
                            multiple
                            class="select select-bordered h-auto"
                            size="3"
                        >
                            {% for category in categories %}
                            <option
                                value="{{ category.id }}"
                                {%
                                if
                                category.id
                                in
                                selected_categories
                                %}selected{%
                                endif
                                %}
                            >
                                {{ category.name }}
                            </option>
                            {% endfor %}
                        </select>
                        <label class="label">
                            <span class="label-text-alt"
                                >Hold Ctrl/Cmd to select multiple</span
                            >
                        </label>
                    </div>

                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-semibold">Tags</span>
                        </label>
                        <select
                            name="tag_ids"
                            multiple
                            class="select select-bordered h-auto"
                            size="3"
                        >
                            {% for tag in tags %}
                            <option
                                value="{{ tag.id }}"
                                {%
                                if
                                tag.id
                                in
                                selected_tags
                                %}selected{%
                                endif
                                %}
                            >
                                {{ tag.name }}
                            </option>
                            {% endfor %}
                        </select>
                        <label class="label">
                            <span class="label-text-alt"
                                >Hold Ctrl/Cmd to select multiple</span
                            >
                        </label>
                    </div>
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-semibold"
                            >Cover Image</span
                        >
                    </label>
                    <input
                        type="hidden"
                        id="cover_image"
                        name="cover_image"
                        value="{{ article.cover_image or '' }}"
                    />
                    <div
                        id="cover-preview"
                        class="{% if not article.cover_image %}hidden{% endif %} mb-3 relative group"
                    >
                        <img
                            id="cover-preview-img"
                            src="{{ article.cover_image or '' }}"
                            alt="Cover"
                            class="w-full max-h-48 object-cover rounded-lg"
                        />
                        <button
                            type="button"
                            onclick="removeCover()"
                            class="btn btn-circle btn-sm btn-error absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity"
                        >
                            ✕
                        </button>
                    </div>
                    <div class="flex gap-2">
                        <label
                            class="btn btn-outline btn-sm flex-1 cursor-pointer"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="w-4 h-4"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
                                />
                            </svg>
                            Upload
                            <input
                                type="file"
                                accept="image/*"
                                class="hidden"
                                onchange="uploadCoverImage(event)"
                            />
                        </label>
                        <button
                            type="button"
                            onclick="openMediaPicker()"
                            class="btn btn-outline btn-sm flex-1"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="w-4 h-4"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
                                />
                            </svg>
                            Media Library
                        </button>
                    </div>
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-semibold">Content</span>
                    </label>
                    <div id="editor" class="bg-base-100 rounded-lg"></div>
                </div>

                <div class="form-control">
                    <label class="label cursor-pointer justify-start gap-4">
                        <input
                            type="checkbox"
                            name="is_featured"
                            class="checkbox checkbox-primary"
                            {%
                            if
                            article.is_featured
                            %}checked{%
                            endif
                            %}
                        />
                        <span class="label-text">Featured Article</span>
                    </label>
                </div>

                <div class="card-actions justify-end gap-2">
                    <a href="/admin/articles" class="btn btn-ghost">Cancel</a>
                    <button
                        type="submit"
                        name="action"
                        value="draft"
                        class="btn btn-outline"
                    >
                        Save Draft
                    </button>
                    <button
                        type="submit"
                        name="action"
                        value="publish"
                        class="btn btn-gradient text-white"
                    >
                        Publish
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<dialog id="media_picker_modal" class="modal">
    <div class="modal-box max-w-4xl">
        <h3 class="font-bold text-lg mb-4">Select Image</h3>
        <div id="media-grid" class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 max-h-[60vh] overflow-y-auto">
            <div class="text-center col-span-full py-8 text-gray-500">Loading...</div>
        </div>
        <div class="modal-action">
            <button type="button" onclick="document.getElementById('media_picker_modal').close()" class="btn btn-ghost">Cancel</button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
{% endblock %} {% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script>
    const quill = new Quill('#editor', {
        theme: 'snow',
        placeholder: 'Start writing your article...',
        modules: {
            toolbar: [
                [{ header: [1, 2, 3, false] }],
                ['bold', 'italic', 'strike'],
                [{ list: 'ordered' }, { list: 'bullet' }],
                ['blockquote', 'code-block'],
                ['link', 'image'],
                ['clean']
            ]
        }
    });

    // Load existing content
    try {
        const content = {{ article.content | tojson | safe }};
        if (content && content.html) {
            quill.root.innerHTML = content.html;
        } else if (content && content.type === 'doc' && content.content) {
            // Legacy TipTap JSON - render to HTML
            function renderNode(node) {
                if (!node) return '';
                switch(node.type) {
                    case 'text': {
                        let t = node.text || '';
                        t = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                        (node.marks || []).forEach(m => {
                            if (m.type === 'bold') t = '<strong>' + t + '</strong>';
                            if (m.type === 'italic') t = '<em>' + t + '</em>';
                            if (m.type === 'strike') t = '<s>' + t + '</s>';
                            if (m.type === 'code') t = '<code>' + t + '</code>';
                            if (m.type === 'link') t = '<a href="' + (m.attrs?.href||'') + '">' + t + '</a>';
                        });
                        return t;
                    }
                    case 'paragraph': return '<p>' + children(node) + '</p>';
                    case 'heading': return '<h' + (node.attrs?.level||1) + '>' + children(node) + '</h' + (node.attrs?.level||1) + '>';
                    case 'bulletList': return '<ul>' + children(node) + '</ul>';
                    case 'orderedList': return '<ol>' + children(node) + '</ol>';
                    case 'listItem': return '<li>' + children(node) + '</li>';
                    case 'blockquote': return '<blockquote>' + children(node) + '</blockquote>';
                    case 'codeBlock': return '<pre><code>' + children(node) + '</code></pre>';
                    case 'image': return '<img src="' + (node.attrs?.src||'') + '">';
                    case 'horizontalRule': return '<hr>';
                    case 'hardBreak': return '<br>';
                    default: return children(node);
                }
            }
            function children(n) { return (n.content||[]).map(renderNode).join(''); }
            quill.root.innerHTML = content.content.map(renderNode).join('');
        }
    } catch(e) {}

    function setCoverImage(url) {
        document.getElementById('cover_image').value = url;
        document.getElementById('cover-preview-img').src = url;
        document.getElementById('cover-preview').classList.remove('hidden');
    }

    function removeCover() {
        document.getElementById('cover_image').value = '';
        document.getElementById('cover-preview').classList.add('hidden');
        document.getElementById('cover-preview-img').src = '';
    }

    async function uploadCoverImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        const formData = new FormData();
        formData.append('file', file);
        try {
            const response = await fetch('/api/admin/media', { method: 'POST', body: formData });
            if (response.ok) {
                const media = await response.json();
                setCoverImage(media.url);
            } else {
                alert('Failed to upload image');
            }
        } catch { alert('Failed to upload image'); }
        event.target.value = '';
    }

    async function openMediaPicker() {
        const modal = document.getElementById('media_picker_modal');
        const grid = document.getElementById('media-grid');
        grid.innerHTML = '<div class="text-center col-span-full py-8 text-gray-500">Loading...</div>';
        modal.showModal();
        try {
            const response = await fetch('/api/admin/media?per_page=100');
            const media = await response.json();
            if (media.length === 0) {
                grid.innerHTML = '<div class="text-center col-span-full py-8 text-gray-500">No images yet. Upload one first.</div>';
                return;
            }
            grid.innerHTML = media.map(item =>
                '<div class="cursor-pointer aspect-square rounded-lg overflow-hidden bg-base-200 border-2 border-transparent hover:border-primary transition-colors" onclick="selectMediaItem(\'' + item.url + '\')">' +
                '<img src="' + item.url + '" alt="' + (item.original_filename || '') + '" class="w-full h-full object-cover" />' +
                '</div>'
            ).join('');
        } catch {
            grid.innerHTML = '<div class="text-center col-span-full py-8 text-error">Failed to load media</div>';
        }
    }

    function selectMediaItem(url) {
        setCoverImage(url);
        document.getElementById('media_picker_modal').close();
    }

    document.getElementById('article-form').addEventListener('submit', async (e) => {
         e.preventDefault();
         console.log('Form submitted', e);

         const form = e.target;
         const articleId = form.dataset.articleId;
         const action = e.submitter?.value || 'draft';

         console.log('Submitter:', e.submitter);
         console.log('Action:', action);

         const data = {
             title: form.querySelector('#title').value,
             excerpt: form.querySelector('#excerpt').value,
             content: { html: quill.root.innerHTML },
             cover_image: form.querySelector('#cover_image').value || null,
             is_published: action === 'publish',
             is_featured: form.querySelector('[name="is_featured"]').checked,
             category_ids: Array.from(form.querySelector('[name="category_ids"]').selectedOptions).map(o => parseInt(o.value)),
             tag_ids: Array.from(form.querySelector('[name="tag_ids"]').selectedOptions).map(o => parseInt(o.value))
         };

         console.log('Data to send:', data);

         try {
             const response = await fetch('/api/admin/articles/' + articleId, {
                 method: 'PUT',
                 headers: { 'Content-Type': 'application/json' },
                 body: JSON.stringify(data)
             });

             console.log('Response status:', response.status);

             if (response.ok) {
                 window.location.href = '/admin/articles';
             } else {
                 try {
                     const error = await response.json();
                     alert(error.detail || 'Failed to save article');
                 } catch {
                     alert('Failed to save article');
                 }
             }
         } catch (err) {
             alert('Failed to save article: ' + err.message);
         }
     });
</script>
{% endblock %}
