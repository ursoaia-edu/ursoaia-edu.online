site_name: Ursoaia Edu Online
site_description: "Open-source electronics & IoT projects from the Ursoaia computer-science circle: Arduino, ESP32, LoPy, Raspberry Pi."
site_author: "Ursoaia Edu Team"
site_url: "https://ursoaia-edu.online"
repo_url: "https://github.com/ursoaia-edu/ursoaia-edu.online.git"
repo_name: "ursoaia-edu/ursoaia-edu.online"

theme:
  name: null
  custom_dir: custom_theme

extra:
  status_badge_text: "Now in the lab"
  status_badge_highlight: "ESP32 Web Server"
  org_url: "https://github.com/ursoaia-edu"

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: false
      reconfigure_search: true
      languages:
        - locale: ro
          default: true
          name: Română
          build: true
          site_name: "Ursoaia Edu Online"
          nav_translations:
            Home: Acasă
            Guide: Ghid
            Projects: Proiecte
            Arduino: Arduino
            "LED Cube": Cub de LED-uri
            "Starter Kits": Kit-uri de pornire
            ESP32: ESP32
            "LED Blink": LED intermitent
            "Temperature & Humidity": Temperatură și umiditate
            "Temperature Web Server": Server web temperatură
            LoPy: LoPy
            "LoRaWAN Node": Nod LoRaWAN
            "Raspberry Pi": Raspberry Pi
            Overview: Prezentare generală
        - locale: en
          name: English
          build: true
          site_name: "Ursoaia Edu Online"

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: "Link to this section"
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Guide:
      - Web:
          - Prezentare curs: guide/web/index.md
          - "00: Cum funcționează web-ul": guide/web/00-introducere.md
          - "01: Prima pagină": guide/web/01-prima-pagina.md
          - "02: HTML bazele": guide/web/02-html-bazele.md
          - "03: Liste și tabele": guide/web/03-html-liste-tabele.md
          - "04: Formulare": guide/web/04-html-formulare.md
          - "05: Multi-pagină": guide/web/05-html-multi-pagina.md
          - "06: CSS introducere": guide/web/06-css-introducere.md
          - "07: Box Model": guide/web/07-css-box-model.md
          - "08: Flexbox și Grid": guide/web/08-css-flexbox-grid.md
          - "09: CSS avansat": guide/web/09-css-avansat.md
          - "10: Responsive": guide/web/10-css-responsive.md
          - "11: JS introducere": guide/web/11-js-introducere.md
          - "12: Variabile și tipuri": guide/web/12-js-variabile-tipuri.md
          - "13: Condiții și bucle": guide/web/13-js-conditii-bucle.md
          - "14: Funcții": guide/web/14-js-functii.md
          - "15: DOM": guide/web/15-js-dom.md
          - "16: Evenimente": guide/web/16-js-evenimente.md
          - "17: Formulare validare": guide/web/17-js-formulare-validare.md
          - "18: Fetch și API": guide/web/18-js-fetch-api.md
          - "Proiect: Portofoliu": guide/web/19-proiect-portofoliu.md
          - "Proiect: Quiz": guide/web/20-proiect-quiz.md
          - "Proiect: Meteo": guide/web/21-proiect-meteo.md
      - Python:
          - Overview: guide/python/index.md
          - "00: Pregătire": guide/python/00-pregatire.md
          - "01: Variabile și tipuri": guide/python/01-variabile-si-tipuri.md
          - "02: Operații și expresii": guide/python/02-operatii-expresii.md
          - "03: Input și Output": guide/python/03-input-output.md
          - "04: Condiții": guide/python/04-conditii.md
          - "05: Bucle": guide/python/05-bucle.md
          - "06: Liste": guide/python/06-liste.md
          - "07: Dicționare": guide/python/07-dictionare.md
          - "08: Funcții": guide/python/08-functii.md
          - "09: Fișiere": guide/python/09-fisiere.md
          - "10: Proiect Joc Aventură": guide/python/10-proiect-joc-aventura.md
          - "11: Proiect Grafice Turtle": guide/python/11-proiect-turtle.md
  - Projects:
      - Arduino:
          - LED Cube: projects/arduino/led_cube.md
          - Starter Kits: projects/arduino/kits.md
      - ESP32:
          - LED Blink: projects/esp32/led_blink.md
          - Temperature & Humidity: projects/esp32/temperature.md
          - Temperature Web Server: projects/esp32/temperature_web.md
      - LoPy:
          - LoRaWAN Node: projects/lopy/lorawan_node.md
      - Raspberry Pi:
          - Overview: projects/raspberry_pi/index.md
