site_name: Ursoaia Edu Online
site_description: "Open-source electronics & IoT projects from the Ursoaia computer-science circle: Arduino, ESP32, LoPy, Raspberry Pi."
site_author: "Ursoaia Edu Team"
site_url: "https://ursoaia-edu.online"
repo_url: "https://github.com/ursoaia-edu/ursoaia-edu.online.git"
repo_name: "ursoaia-edu/ursoaia-edu.online"

theme:
  name: null
  custom_dir: custom_theme

extra:
  status_badge_text: "Now in the lab"
  status_badge_highlight: "ESP32 Web Server"
  org_url: "https://github.com/ursoaia-edu"
  gtm_id: "GTM-WD9LXKB7"

hooks:
  - hooks/copy_well_known.py

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: false
      reconfigure_search: true
      languages:
        - locale: ro
          default: true
          name: Română
          build: true
          site_name: "Ursoaia Edu Online"
          nav_translations:
            Home: Acasă
            Courses: Cursuri
            Projects: Proiecte
            Arduino: Arduino
            "LED Cube": Cub de LED-uri
            "Starter Kits": Kit-uri de pornire
            "Starter Kit": Kit de pornire
            ESP32: ESP32
            "LED Blink": LED intermitent
            "Temperature & Humidity": Temperatură și umiditate
            "Temperature Web Server": Server web temperatură
            LoPy: LoPy
            "LoRaWAN Node": Nod LoRaWAN
            "Raspberry Pi": Raspberry Pi
            Overview: Prezentare generală
        - locale: en
          name: English
          build: true
          site_name: "Ursoaia Edu Online"

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: "Link to this section"
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Courses:
      - Overview: courses/index.md
      - Web:
          - Prezentare curs: courses/web/index.md
          - "00: Cum funcționează web-ul": courses/web/00-introducere.md
          - "01: Prima pagină": courses/web/01-prima-pagina.md
          - "02: HTML bazele": courses/web/02-html-bazele.md
          - "03: Liste și tabele": courses/web/03-html-liste-tabele.md
          - "04: Formulare": courses/web/04-html-formulare.md
          - "05: Multi-pagină": courses/web/05-html-multi-pagina.md
          - "06: CSS introducere": courses/web/06-css-introducere.md
