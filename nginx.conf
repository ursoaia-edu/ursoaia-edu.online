server {
    server_name ursoaia-edu.online www.ursoaia-edu.online;

    root /var/www/ursoaia-edu.online;
    index index.html;

    access_log /var/log/nginx/ursoaia-edu.online.access.log;
    error_log  /var/log/nginx/ursoaia-edu.online.error.log;

    # ==================== Security headers ====================
    # Note: nginx replaces (does NOT merge) add_header from parent when a location
    # defines its own add_header — so locations below intentionally avoid
    # add_header and rely on the `expires` directive for Cache-Control.

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://*.analytics.google.com https://*.google-analytics.com; frame-src https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.ht {
        deny all;
    }

    # Fonts: Google's woff2 filenames are content-hashed → safe forever.
    location ~* \.woff2$ {
        expires 365d;
        access_log off;
    }

    # Images + JS: content rarely changes; pinned Lucide version.
    # If we ever need to invalidate fast, bump nginx config or rename the file.
    location ~* \.(jpg|jpeg|png|webp|gif|ico|svg|js)$ {
        expires 30d;
        access_log off;
    }

    # CSS: iterates more often (theme/Tailwind tweaks) → shorter cache so
    # changes propagate within a week without manual cache-bust.
    location ~* \.css$ {
        expires 7d;
        access_log off;
    }

    listen 443 ssl http2; # `http2` works on nginx 1.9.5+; on 1.25.1+ prefer the separate `http2 on;` directive
    ssl_certificate /etc/letsencrypt/live/ursoaia-edu.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ursoaia-edu.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.ursoaia-edu.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = ursoaia-edu.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name ursoaia-edu.online www.ursoaia-edu.online;
    return 404; # managed by Certbot
}
